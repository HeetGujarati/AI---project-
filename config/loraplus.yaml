# LoRA+ Configuration
method: "loraplus"
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

optimizer:
  name: "AdamW"
  lr_a: 1.0e-4
  default_ratio: 16.0
  embedding_lr: 1.0e-6
  weight_decay: 0.01

ratios_to_test:
  - 4.0
  - 8.0
  - 16.0
  - 32.0
