# Base Configuration for LoRA+ Research on RTX 4060 (8GB)
model:
  name: "Qwen/Qwen2.5-1.5B"
  fallback_name: "distilgpt2"
  torch_dtype: "float16"
  trust_remote_code: true

dataset:
  name: "yahma/alpaca-cleaned"
  fallback_name: "tatsu-lab/alpaca"
  max_seq_length: 512
  max_train_samples: 500
  max_eval_samples: 100
  train_split: "train[:90%]"
  eval_split: "train[90%:]"

training:
  seed: 42
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 2
  lr_scheduler_type: "linear"
  fp16: true
  gradient_checkpointing: true
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  evaluation_strategy: "steps"
  save_strategy: "no"
  output_dir: "experiments/checkpoints"
  logging_dir: "experiments/logs"

hardware:
  target_gpu: "NVIDIA GeForce RTX 4060"
  target_vram_gb: 8
  device: "cuda"
  empty_cuda_cache: true
